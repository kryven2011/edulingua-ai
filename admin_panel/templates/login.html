<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduLingua AI — Admin Login</title>
  <link rel="stylesheet" href="/static/css/admin.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-body">
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="logo-badge">🎓 EduLingua AI</div>
        <h2>Панель управления</h2>
        <p>Авторизация администратора</p>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="username">Имя пользователя</label>
          <input type="text" id="username" name="username" required autocomplete="username" placeholder="admin">
        </div>

        <div class="form-group">
          <label for="password">Пароль</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
        </div>

        <div id="loginError" class="error-banner" style="display: none;"></div>

        <button type="submit" id="submitBtn" class="btn btn-primary btn-block">Войти в систему</button>
      </form>
    </div>
  </div>

  <script src="/static/js/admin.js"></script>
</body>
</html>
